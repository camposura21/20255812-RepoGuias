<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/stylesFunciones.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Validación de estudiante</title>
</head>

<body>
    <header>
        <div class="px-3 py-2 text-bg-dark fixed-top">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <a href="../indexFunciones.html"
                        class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
                        <img src="../img/js.png" alt="" width="32" height="32" class="me-2" />
                    </a>

                    <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small nav-bar">
                        <li class="text-center">
                            <a href="recursividad.html" class="nav-link text-white">
                                <i class="bi bi-arrow-clockwise bi-2 d-block"></i>
                                Recursividad
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="tabla.html" class="nav-link text-white">
                                <i class="bi bi-table bi-2 d-block"></i>
                                Creando una Tabla
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="formulario.html" class="nav-link text-white">
                                <i class="bi bi-ui-checks bi-2 d-block"></i>
                                Formulario
                            </a>
                        </li>
                        <li class="text-center nav-bar-li-active">
                            <a href="validacionEstudiante.html" class="nav-link text-white">
                                <i class="bi bi-check2-square bi-2 d-block"></i>
                                Validación
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <div class="container-lg">
        <div class="row">
            <div class="col-12 shadow-lg p-3 mt-5 bg-body rounded">
                <h3>Ficha de estudiante</h3>
                <form id="idFormEstudiante">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtCarnet" placeholder="Carnet"
                                    maxlength="5" />
                                <label for="idTxtCarnet">
                                    <i class="bi bi-person-badge"></i> Carnet (AB001)
                                </label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtNombreCompleto"
                                    placeholder="Nombre completo" />
                                <label for="idTxtNombreCompleto">
                                    <i class="bi bi-person-circle"></i> Nombre completo
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtDui" placeholder="DUI"
                                    maxlength="10" />
                                <label for="idTxtDui">
                                    <i class="bi bi-credit-card"></i> DUI (########-#)
                                </label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtNit" placeholder="NIT"
                                    maxlength="17" />
                                <label for="idTxtNit">
                                    <i class="bi bi-credit-card-2-front"></i> NIT (####-######-###-#)
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtFechaNacimientoEstudiante"
                                    placeholder="dd/mm/aaaa" maxlength="10" />
                                <label for="idTxtFechaNacimientoEstudiante">
                                    <i class="bi bi-calendar-date"></i> Fecha de nacimiento (dd/mm/aaaa)
                                </label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtCorreo" placeholder="Correo"
                                    maxlength="100" />
                                <label for="idTxtCorreo">
                                    <i class="bi bi-envelope"></i> Correo electrónico
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtEdad" placeholder="Edad"
                                    maxlength="3" />
                                <label for="idTxtEdad">
                                    <i class="bi bi-123"></i> Edad
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-12 pt-3">
                            <button id="idBtnValidar" type="submit" class="btn btn-success">
                                <i class="bi bi-check2-circle"></i> Validar
                            </button>
                            <button id="idBtnLimpiarEstudiante" type="button" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Limpiar formulario
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-12 shadow-lg p-3 mt-5 bg-body rounded">
                <h3>Resultado de la validación</h3>
                <div id="idContainerResultadoValidacion">Ninguno</div>
            </div>
        </div>
    </div>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validacionEstudiante.js" defer></script>
</body>

</html>
