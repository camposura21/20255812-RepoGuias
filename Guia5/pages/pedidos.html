<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="../js/pedidos.js" defer></script>
    <title>Gestión de pedidos de una cafetería</title>
  </head>
  <body>
    <div class="container py-4">
      <h1 class="text-center mb-4">Gestión de pedidos de la cafetería</h1>

      <form id="formPedido" class="row g-3 mb-4">
        <div class="col-md-4">
          <label for="inputProducto" class="form-label">Producto</label>
          <input type="text" class="form-control" id="inputProducto" required />
        </div>
        <div class="col-md-3">
          <label for="inputPrecio" class="form-label">Precio unitario</label>
          <input type="number" class="form-control" id="inputPrecio" step="0.01" required />
        </div>
        <div class="col-md-3">
          <label for="inputCantidad" class="form-label">Cantidad</label>
          <input type="number" class="form-control" id="inputCantidad" step="1" required />
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" id="btnAgregarPedido" class="btn btn-primary w-100">
            Agregar pedido
          </button>
        </div>
      </form>

      <div class="row g-3 align-items-end mb-4">
        <div class="col-md-4">
          <label for="inputPrecioMaximo" class="form-label">Precio máximo</label>
          <input type="number" class="form-control" id="inputPrecioMaximo" step="0.01" />
        </div>
        <div class="col-md-3">
          <button type="button" id="btnFiltrar" class="btn btn-secondary w-100">
            Filtrar productos
          </button>
        </div>
        <div class="col-md-3">
          <button type="button" id="btnMostrarTodos" class="btn btn-secondary w-100">
            Mostrar todos
          </button>
        </div>
        <div class="col-md-2">
          <button type="button" id="btnLimpiar" class="btn btn-danger w-100">
            Limpiar pedidos
          </button>
        </div>
      </div>

      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th scope="col">Producto</th>
            <th scope="col">Precio unitario</th>
            <th scope="col">Cantidad</th>
            <th scope="col">Subtotal</th>
          </tr>
        </thead>
        <tbody id="idCuerpoPedidos"></tbody>
      </table>

      <p class="fw-bold">
        Total de unidades: <span id="idTotalUnidades">0</span> |
        Monto total: $<span id="idTotalMonto">0.00</span>
      </p>

      <a href="../index.html" class="btn btn-link">Regresar</a>
    </div>
  </body>
</html>
